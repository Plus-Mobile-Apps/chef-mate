#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g

#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.dependency.useConstraints=false
android.builtInKotlin=false
android.newDsl=false
android.experimental.enableScreenshotTest=true
# The screenshot plugin otherwise leaves its test JVM at Gradle's 512m default, which layoutlib
# outgrows rendering 300+ previews: the worker dies with OutOfMemoryError ("Could not complete
# execution for Gradle Test Executor") partway through, flakily on CI.
android.compose.screenshot.maxHeapSize=2g
