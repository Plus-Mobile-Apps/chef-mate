name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't let one platform's failure cancel the others (e.g. keep building the
      # Windows MSIX even if the macOS leg fails).
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            artifact-name: desktop-windows
            artifact-path: client/composeApp/build/compose/binaries/main-release/msi/*.msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-name: desktop-linux
            artifact-path: client/composeApp/build/compose/binaries/main-release/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native package
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}
        run: ./gradlew :client:composeApp:${{ matrix.task }}

      # The Flathub manifest (packaging/linux/com.plusmobileapps.chefmate.yml) consumes this tarball
      # rather than the .deb: it is the jpackage app image — bundled jlink runtime included, so the
      # flatpak needs no JDK extension — plus the hicolor icon sizes and the license file that the
      # manifest installs into the sandbox prefix.
      - name: Package Linux app image tarball (Flathub)
        if: runner.os == 'Linux'
        # Same reason the Windows MSIX step re-declares these: BuildKonfig reads them via
        # System.getenv at Gradle configuration time, and GitHub Actions env vars are per-step.
        # Without them this step reconfigures with placeholder Supabase keys and rebuilds the app
        # image with broken auth.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew :client:composeApp:createReleaseDistributable

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' client/composeApp/build.gradle.kts | head -n1)
          fi

          # jpackage names the app image directory after the platform packageName, so glob for it
          # instead of hardcoding a name the Gradle config could change out from under us.
          APP_DIR=$(find client/composeApp/build/compose/binaries/main-release/app \
            -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -z "$APP_DIR" ]; then echo "No app image produced" >&2; exit 1; fi

          STAGE="${RUNNER_TEMP}/chef-mate-${VERSION}"
          mkdir -p "$STAGE/icons"
          cp -a "$APP_DIR" "$STAGE/app"
          cp LICENSE "$STAGE/LICENSE"

          # Flathub wants icons at the standard hicolor sizes; the source is 584x584, which is not
          # one of them, so resize rather than shipping a mis-binned icon.
          IM=$(command -v magick || command -v convert)
          for size in 64 128 256 512; do
            "$IM" client/composeApp/src/jvmMain/resources/app-icon.png \
              -resize "${size}x${size}" "$STAGE/icons/${size}.png"
          done

          tar -czf "${RUNNER_TEMP}/chef-mate-${VERSION}-linux-x86_64.tar.gz" \
            -C "${RUNNER_TEMP}" "chef-mate-${VERSION}"

      - name: Upload Flathub tarball (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-flatpak-tarball
          path: ${{ runner.temp }}/chef-mate-*-linux-x86_64.tar.gz

      - name: Build app image for MSIX (Windows)
        if: runner.os == 'Windows'
        # BuildKonfig reads these at Gradle configuration time via System.getenv, and GitHub
        # Actions env vars are per-step. The MSIX is packed from THIS step's app image, so it
        # needs the secrets too — without them BuildConfig regenerates with placeholder Supabase
        # keys and every auth call fails at runtime.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}
        run: ./gradlew :client:composeApp:createReleaseDistributable

      - name: Package MSIX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          $img = "client/composeApp/build/compose/binaries/main-release/app/Chef Mate"

          # Resolve the release version (tag on push; build.gradle.kts otherwise) as 4-part x.y.z.0
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = (Select-String 'versionName = "(.+?)"' client/composeApp/build.gradle.kts).Matches[0].Groups[1].Value
          }
          $msixVersion = "$version.0"

          # Identity from Store secrets, with placeholders so the MSIX still builds when unset
          $idName = if ($env:STORE_IDENTITY_NAME) { $env:STORE_IDENTITY_NAME } else { "PlusMobileApps.ChefMate" }
          $publisher = if ($env:STORE_PUBLISHER) { $env:STORE_PUBLISHER } else { "CN=Plus Mobile Apps" }

          # Substitute manifest tokens and drop it next to the app image
          (Get-Content packaging/windows/AppxManifest.xml -Raw) `
            -replace '__IDENTITY_NAME__', $idName `
            -replace '__PUBLISHER__', $publisher `
            -replace '__VERSION__', $msixVersion |
            Set-Content "$img/AppxManifest.xml"

          # Reuse the existing app icon for the required Store logo assets (replace with
          # correctly-sized PNGs for Store certification).
          New-Item -ItemType Directory -Force -Path "$img/Assets" | Out-Null
          $icon = "client/composeApp/src/jvmMain/resources/app-icon.png"
          Copy-Item $icon "$img/Assets/StoreLogo.png"
          Copy-Item $icon "$img/Assets/Square150x150Logo.png"
          Copy-Item $icon "$img/Assets/Square44x44Logo.png"

          $makeappx = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $makeappx pack /d "$img" /p "$env:RUNNER_TEMP\ChefMate.msix" /o

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - name: Upload MSIX artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msix
          path: ${{ runner.temp }}/ChefMate.msix

  # Builds the Mac App Store .pkg and uploads it to App Store Connect. Tag pushes only — every
  # upload creates a new build in App Store Connect, so we don't want manual dispatches doing it.
  # (To test the signed .pkg build without uploading, run `bundle exec fastlane mac release` locally
  # after generating the certs once with `bundle exec fastlane mac certificates`.)
  macos:
    # Tag pushes build + upload to App Store Connect. A manual workflow_dispatch also runs, but
    # builds + signs the .pkg only (MAC_UPLOAD=false) so you can validate signing without creating
    # an App Store Connect build.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build .pkg (and upload to App Store Connect on tags)
        # The fastlane mac release lane fetches the App Store certs + provisioning profile via match,
        # resolves the signing identity, runs packageReleasePkg (BuildKonfig reads the Supabase/
        # Bugsnag secrets at Gradle configuration time), then uploads the .pkg to App Store Connect
        # when MAC_UPLOAD=true (tag builds only).
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: https://github.com/Plus-Mobile-Apps/certificates.git
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}
          MAC_UPLOAD: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: bundle exec fastlane mac release

      - name: Dump jpackage / codesign logs on failure
        if: failure()
        run: |
          echo "== compose jpackage + signing logs =="
          for f in client/composeApp/build/compose/logs/**/*.txt; do
            echo "----- $f -----"
            cat "$f" || true
          done

      - name: Upload .pkg + logs (dispatch debugging)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-pkg
          if-no-files-found: warn
          path: |
            client/composeApp/build/compose/binaries/main-release/pkg/*.pkg
            client/composeApp/build/compose/logs/**/*.txt

  release:
    needs: build
    # Only publish a GitHub Release for tag pushes; a manual workflow_dispatch on a
    # branch just builds artifacts (e.g. to grab the MSIX) without cutting a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate update feed
        # Only Linux reads this feed. macOS ships via the Mac App Store and Windows via the
        # Microsoft Store; the in-app updater is a no-op on both, so neither appears here.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          DEB=$(cd artifacts && ls *.deb)
          cat > artifacts/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notesUrl": "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}",
            "downloads": {
              "linux": "${BASE}/${DEB}"
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # Submits the MSIX to the Microsoft Store. Runs only on tag pushes, and each step
  # no-ops unless STORE_PRODUCT_ID is configured. The very first submission for a new
  # app must still be made manually in Partner Center to create the listing.
  publish-store:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.STORE_PRODUCT_ID != ''
        with:
          name: desktop-windows-msix
          path: msix

      # NOTE: verify the action ref against the current MSStore CLI docs before relying on it.
      - name: Setup MSStore CLI
        if: env.STORE_PRODUCT_ID != ''
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure MSStore CLI
        if: env.STORE_PRODUCT_ID != ''
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Publish to Microsoft Store
        if: env.STORE_PRODUCT_ID != ''
        shell: pwsh
        run: |
          $msix = (Get-ChildItem msix/*.msix | Select-Object -First 1).FullName
          # -id is the Partner Center app/product id; adjust if your account uses a separate Store ID.
          msstore publish -i $msix -id $env:STORE_PRODUCT_ID
